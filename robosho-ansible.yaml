- name: roboshop instance
  hosts: local
  connection: local
  vars: 
   instnaces: ["mongodb", "redis", "mysql"]
   imageid: ami-0220d79f3f480ecf5
  tasks: 
  - name: create EC2 instance
    amazon.aws.ec2_instance:
     instance_type: t3.micro
     name: "roboshop-{{ item }}"
     imageid: "{{ imageid }}"
     security_groups: 
     - "roboshop-{{ item }}"
     - roboshop-common
    loop: "{{ instances }}"
    register: ec2_output

  - name: print ec2_output
    debug: 
     msg: "{{ec2_output }}"

  